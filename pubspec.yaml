name: chef_starz
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # UI & State Management
  get: ^4.7.3
  cupertino_icons: ^1.0.8
  auto_size_text: ^3.0.0
  responsive_framework: ^1.5.1

  # Development Tools
  flutter_svg: ^2.1.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  image_picker: ^1.2.1
  camera: ^0.11.3
  path_provider: ^2.1.5
  path: ^1.9.1
  smooth_page_indicator: ^2.0.1
  http: ^1.6.0
  shared_preferences: ^2.5.4
  pinput: ^6.0.2
  video_player: ^2.11.0
  share_plus: ^12.0.1
  chewie: ^1.13.0
  visibility_detector: ^0.4.0+2
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1
  flutter_secure_storage: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  objective_c: 9.1.0

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_logo.png"
  min_sdk_android: 21
  remove_alpha_ios: false  # Keep alpha channel for iOS
  adaptive_icon_background: "#FF1493"  # Deep Pink background (Android only)
  adaptive_icon_foreground: "assets/icon/app_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/icons/
    - assets/images/